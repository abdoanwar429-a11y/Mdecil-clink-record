<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العيادة - لوحة التحكم</title>
    
    <!-- PWA -->
    <link rel="manifest" id="manifest-link">
    <meta name="theme-color" content="#0f4c81">
    
    <style>
        :root {
            --primary: #0f4c81;
            --primary-light: #3a6ea5;
            --accent: #e8f0fe;
            --danger: #d32f2f;
            --success: #2e7d32;
            --warning: #f9a825;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --radius: 12px;
            --sidebar-width: 240px;
            --header-height: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Tahoma', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        /* ========= شريط جانبي ========= */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--primary);
            color: white;
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            padding: 20px 0;
            z-index: 100;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .sidebar-header {
            padding: 0 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }
        .sidebar-header h2 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header small {
            opacity: 0.8;
            font-size: 12px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            margin: 4px 10px;
            border-radius: 8px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.2);
        }
        .nav-item .icon { font-size: 20px; width: 24px; text-align: center; }

        /* ========= المحتوى الرئيسي ========= */
        .main-content {
            margin-right: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .top-bar {
            background: var(--card-bg);
            height: var(--header-height);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .top-bar h1 {
            font-size: 22px;
            color: var(--primary);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }
        .logout-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .page-content {
            padding: 24px;
            flex: 1;
        }

        /* ========= البطاقات والإحصائيات ========= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border-right: 4px solid;
        }
        .stat-card.blue { border-color: var(--primary); }
        .stat-card.red { border-color: var(--danger); }
        .stat-card.green { border-color: var(--success); }
        .stat-card .label { font-size: 14px; color: var(--text-light); margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 700; }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        /* ========= تبويبات للشاشات الصغيرة ========= */
        .mobile-tabs {
            display: none;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .mobile-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: 600;
            background: #f1f5f9;
            cursor: pointer;
        }
        .mobile-tab.active {
            background: var(--primary);
            color: white;
        }

        /* ========= النماذج والعناصر ========= */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            transition: border 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(15,76,129,0.1);
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #0a3a5e; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: #333; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-sm { padding: 6px 14px; font-size: 13px; }
        .btn-block { width: 100%; justify-content: center; }

        .flex-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .flex-row > * { flex: 1; min-width: 140px; }

        /* قوائم */
        .list-item {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border-right: 4px solid var(--primary);
            position: relative;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }
        .item-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }
        .item-actions { display: flex; gap: 8px; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .info-row {
            display: flex;
            gap: 6px;
            font-size: 14px;
        }
        .info-label { font-weight: 600; color: var(--text); min-width: 90px; }
        .info-value { color: var(--text-light); word-break: break-word; }

        .search-input {
            margin-bottom: 20px;
        }

        /* ========= إعدادات ========= */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* ========= تنبيهات التفعيل ========= */
        .activation-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .activation-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .device-id {
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 20px;
            color: var(--danger);
            margin: 15px 0;
            display: inline-block;
            border: 1px dashed var(--danger);
        }

        /* ========= responsive ========= */
        @media (max-width: 900px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .mobile-tabs { display: flex; }
            .form-grid { grid-template-columns: 1fr; }
            .settings-grid { grid-template-columns: 1fr; }
            .top-bar h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

<!-- شاشة التفعيل -->
<div id="activationScreen" class="activation-overlay" style="display:flex">
    <div class="activation-box">
        <h2 style="color: var(--primary);">تنشيط الاشتراك</h2>
        <p>أرسل الكود التالي للمبرمج لتفعيل النسخة</p>
        <div id="displayDeviceID" class="device-id">----</div>
        <input type="text" id="activationInput" placeholder="أدخل كود التفعيل السنوي" style="margin:10px 0; width:100%">
        <button class="btn btn-primary btn-block" onclick="validateActivation()">تفعيل الآن</button>
        <p id="actError" style="color:red; margin-top:8px; font-size:13px;"></p>
    </div>
</div>

<!-- واجهة تسجيل الدخول -->
<div id="loginScreen" class="activation-overlay" style="display:none">
    <div class="activation-box">
        <h2 style="color: var(--primary);">تسجيل الدخول</h2>
        <input type="text" id="user" placeholder="اسم المستخدم" style="width:100%; margin:10px 0">
        <input type="password" id="pass" placeholder="كلمة المرور" style="width:100%; margin-bottom:15px">
        <button class="btn btn-primary btn-block" onclick="checkLogin()">دخول</button>
    </div>
</div>

<!-- التطبيق الرئيسي (مخفي حتى تسجيل الدخول) -->
<div id="mainApp" style="display:none; width:100%;">

    <!-- الشريط الجانبي -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🏥 <span id="sidebarClinicName">العيادة</span></h2>
            <small id="sidebarExpiry"></small>
        </div>
        <nav>
            <div class="nav-item active" data-tab="patients">
                <span class="icon">📋</span> سجل الزيارات
            </div>
            <div class="nav-item" data-tab="expenses">
                <span class="icon">💰</span> المصاريف
            </div>
            <div class="nav-item" data-tab="settings">
                <span class="icon">⚙️</span> الإعدادات
            </div>
        </nav>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <header class="top-bar">
            <h1 id="topBarTitle">سجل الزيارات</h1>
            <div class="user-info">
                <span>👤 admin</span>
                <button class="logout-btn" onclick="location.reload()">تسجيل الخروج</button>
            </div>
        </header>

        <!-- تبويبات الجوال -->
        <div class="mobile-tabs" id="mobileTabs">
            <div class="mobile-tab active" data-mtab="patients">الزيارات</div>
            <div class="mobile-tab" data-mtab="expenses">المصاريف</div>
            <div class="mobile-tab" data-mtab="settings">الإعدادات</div>
        </div>

        <div class="page-content" id="pageContent">
            <!-- سيتم تحميل المحتوى هنا ديناميكيًا -->
        </div>
    </div>
</div>

<script>
    // ======================= البيانات الأساسية =======================
    const STORAGE_KEY = "CLINIC_PRO_V7_6";
    let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { 
        settings: { clinicName: "عيادة الطبيب", expiryDate: null },
        patients: {}, 
        visits: [], 
        expenses: [] 
    };

    let deviceId = localStorage.getItem('CLINIC_SERIAL') || Math.floor(1000 + Math.random() * 9000).toString();
    localStorage.setItem('CLINIC_SERIAL', deviceId);
    document.getElementById('displayDeviceID').innerText = deviceId;

    // ======================= دوال التاريخ =======================
    function parseExpiryDate(dateStr) {
        if (!dateStr) return null;
        let d = new Date(dateStr);
        if (!isNaN(d.getTime())) return d;
        if (typeof dateStr === 'string' && dateStr.includes('/')) {
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                d = new Date(year, month, day);
                if (!isNaN(d.getTime())) return d;
            }
        }
        return null;
    }

    function toDateInputValue(dateStr) {
        if (!dateStr) return '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
        const d = new Date(dateStr);
        if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
        return '';
    }

    function formatDisplayDate(dateStr) {
        if (!dateStr) return '---';
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }
        const d = new Date(dateStr);
        if (!isNaN(d.getTime())) {
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }
        return dateStr;
    }

    function getRemainingDays(isoString) {
        if (!isoString) return null;
        const expiry = new Date(isoString);
        if (isNaN(expiry)) return null;
        const now = new Date();
        const diffTime = expiry - now;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    // ======================= التفعيل وتسجيل الدخول =======================
    function checkActivationStatus() {
        const locked = localStorage.getItem('APP_LOCKED');
        if (locked === 'false') {
            const expiryStr = db.settings.expiryDate;
            const expiryDate = parseExpiryDate(expiryStr);
            if (!expiryDate || isNaN(expiryDate.getTime())) {
                localStorage.setItem('APP_LOCKED', 'true');
                alert("بيانات الاشتراك غير صالحة");
                location.reload();
                return false;
            }
            if (expiryDate < new Date()) {
                localStorage.setItem('APP_LOCKED', 'true');
                alert("انتهت صلاحية الاشتراك");
                location.reload();
                return false;
            }
            document.getElementById('activationScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            return true;
        } else {
            document.getElementById('activationScreen').style.display = 'flex';
            document.getElementById('loginScreen').style.display = 'none';
            return false;
        }
    }
    checkActivationStatus();

    function validateActivation() {
        const input = document.getElementById('activationInput').value;
        const correctCode = (parseInt(deviceId) * 7 + 500).toString();
        if (input === correctCode) {
            localStorage.setItem('APP_LOCKED', 'false');
            let d = new Date();
            d.setFullYear(d.getFullYear() + 1);
            db.settings.expiryDate = d.toISOString();
            saveDB();
            alert("تم التفعيل بنجاح! تاريخ الانتهاء: " + formatDisplayDate(db.settings.expiryDate));
            location.reload();
        } else {
            document.getElementById('actError').innerText = "كود التفعيل غير صحيح!";
        }
    }

    function checkLogin() {
        if(document.getElementById('user').value === 'admin' && document.getElementById('pass').value === 'admin') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            applySettings();
            switchTab('patients');
            document.getElementById('sidebar').classList.add('open'); // للجوال
        } else { 
            alert("خطأ في البيانات"); 
        }
    }

    // ======================= الإعدادات العامة =======================
    function applySettings() {
        const name = db.settings.clinicName || "عيادة الطبيب";
        document.getElementById('sidebarClinicName').innerText = name;
        document.getElementById('topBarTitle').innerText = name + " - لوحة التحكم";

        const expiryIso = db.settings.expiryDate;
        if (expiryIso) {
            const remaining = getRemainingDays(expiryIso);
            const formatted = formatDisplayDate(expiryIso);
            if (remaining > 0) {
                document.getElementById('sidebarExpiry').innerHTML = `✅ متبقي ${remaining} يوم`;
            } else {
                document.getElementById('sidebarExpiry').innerHTML = `❌ منتهي الصلاحية`;
                setTimeout(() => { alert("انتهت الصلاحية"); location.reload(); }, 500);
            }
        } else {
            document.getElementById('sidebarExpiry').innerHTML = '⚠️ غير مفعل';
        }
    }

    function saveDB() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

    // ======================= التبويبات والتنقل =======================
    const navItems = document.querySelectorAll('.nav-item');
    const mobileTabs = document.querySelectorAll('.mobile-tab');
    let currentTab = 'patients';

    navItems.forEach(item => {
        item.addEventListener('click', () => switchTab(item.dataset.tab));
    });

    mobileTabs.forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.mtab));
    });

    function switchTab(tabName) {
        currentTab = tabName;
        navItems.forEach(n => n.classList.remove('active'));
        mobileTabs.forEach(t => t.classList.remove('active'));
        document.querySelector(`.nav-item[data-tab="${tabName}"]`)?.classList.add('active');
        document.querySelector(`.mobile-tab[data-mtab="${tabName}"]`)?.classList.add('active');
        document.getElementById('sidebar').classList.remove('open'); // إغلاق الجوال بعد الاختيار

        const container = document.getElementById('pageContent');
        switch(tabName) {
            case 'patients': container.innerHTML = renderPatientsTab(); break;
            case 'expenses': container.innerHTML = renderExpensesTab(); break;
            case 'settings': container.innerHTML = renderSettingsTab(); break;
        }
        // بعد تحديث الـ DOM، نُشغّل الإحصائيات والقوائم
        if (tabName === 'patients') refreshStatsAndLists();
        else if (tabName === 'expenses') renderExpensesList();
    }

    // ======================= شاشة الزيارات =======================
    function renderPatientsTab() {
        return `
            <div class="stats-grid" id="statsContainer">
                <div class="stat-card blue"><div class="label">دخل اليوم</div><div class="value" id="statToday">0</div></div>
                <div class="stat-card red"><div class="label">إجمالي المصاريف</div><div class="value" id="statExpenses">0</div></div>
                <div class="stat-card green"><div class="label">الربح الصافي</div><div class="value" id="statNet">0</div></div>
            </div>
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
                    <h3 id="formTitle">إضافة زيارة جديدة</h3>
                    <button class="btn btn-outline btn-sm" onclick="resetForm()">+ مريض جديد</button>
                </div>
                <input type="hidden" id="editingUid">
                <div class="form-grid">
                    <div class="form-group"><label>رقم الملف</label><input type="number" id="pId" oninput="autoLoadPatient()"></div>
                    <div class="form-group"><label>اسم المريض</label><input type="text" id="pName"></div>
                    <div class="form-group"><label>العمر</label><input type="number" id="pAge"></div>
                    <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="pPhone"></div>
                    <div class="form-group"><label>مكان السكن</label><input type="text" id="pAddress"></div>
                    <div class="form-group"><label>المبلغ</label><input type="number" id="pPrice" value="0"></div>
                    <div class="form-group"><label>الدور (انتظار اليوم)</label><input type="number" id="pTurn" readonly style="background:#f0f0f0; cursor:default;"></div>
                    <div class="form-group"><label>تاريخ المراجعة</label><input type="date" id="pNext"></div>
                </div>
                <div class="form-group"><label>التشخيص والملاحظات</label><textarea id="pCase" rows="3"></textarea></div>
                <div class="flex-row" style="margin-top:15px">
                    <button class="btn btn-primary" id="saveBtn" onclick="saveVisit()">حفظ الزيارة</button>
                    <button class="btn btn-secondary" id="cancelBtn" onclick="resetForm()" style="display:none">إلغاء</button>
                </div>
            </div>
            <input type="text" class="search-input" id="searchInput" onkeyup="renderVisitsList()" placeholder="🔍 بحث بالاسم أو الرقم أو الهاتف...">
            <div id="visitListContainer"></div>
        `;
    }

    function refreshStatsAndLists() {
        const todayStr = new Date().toLocaleDateString('en-GB');
        const incToday = db.visits.filter(v => v.date === todayStr).reduce((s, v) => s + v.price, 0);
        const totalExp = db.expenses.reduce((s, e) => s + e.amount, 0);
        const totalInc = db.visits.reduce((s, v) => s + v.price, 0);
        document.getElementById('statToday').innerText = incToday.toLocaleString();
        document.getElementById('statExpenses').innerText = totalExp.toLocaleString();
        document.getElementById('statNet').innerText = (totalInc - totalExp).toLocaleString();
        renderVisitsList();
    }

    function renderVisitsList() {
        const search = document.getElementById('searchInput')?.value?.toLowerCase() || '';
        const container = document.getElementById('visitListContainer');
        if (!container) return;
        container.innerHTML = db.visits.slice().reverse().map(v => {
            const p = db.patients[v.pId];
            if (!p) return '';
            const searchSource = (p.name + v.pId + (p.phone || '')).toLowerCase();
            if (!searchSource.includes(search)) return '';
            const visitCount = db.visits.filter(x => db.patients[x.pId]?.name === p.name).length;
            const formattedNext = formatDisplayDate(v.nextDate);
            return `
                <div class="list-item">
                    <div class="item-header">
                        <div class="item-title">${p.name}</div>
                        <div class="item-actions">
                            <button class="btn btn-outline btn-sm" onclick="editVisit(${v.uid})">✏️ تعديل</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteVisit(${v.uid})">🗑️ حذف</button>
                        </div>
                    </div>
                    <div class="info-grid">
                        <div class="info-row"><span class="info-label">رقم الملف:</span><span class="info-value">${v.pId}</span></div>
                        <div class="info-row"><span class="info-label">الدور:</span><span class="info-value">${v.turn || '---'}</span></div>
                        <div class="info-row"><span class="info-label">عدد الزيارات:</span><span class="info-value">${visitCount}</span></div>
                        <div class="info-row"><span class="info-label">العمر:</span><span class="info-value">${p.age || '---'}</span></div>
                        <div class="info-row"><span class="info-label">الهاتف:</span><span class="info-value">${p.phone || '---'}</span></div>
                        <div class="info-row"><span class="info-label">السكن:</span><span class="info-value">${p.address || '---'}</span></div>
                        <div class="info-row"><span class="info-label">تاريخ الزيارة:</span><span class="info-value">${v.date}</span></div>
                        <div class="info-row"><span class="info-label">تاريخ المراجعة:</span><span class="info-value" style="color:var(--primary); font-weight:bold">${formattedNext}</span></div>
                        <div class="info-row"><span class="info-label">المبلغ:</span><span class="info-value">${v.price.toLocaleString()}</span></div>
                    </div>
                    <div style="margin-top:12px; white-space:pre-wrap; font-size:14px; color:var(--text-light)"><strong>التشخيص:</strong> ${v.pCase || '---'}</div>
                </div>`;
        }).join('');
    }

    // ======================= دوال الحفظ (الدور الآن يعتمد على اليوم) =======================
    function saveVisit() {
        const uidStr = document.getElementById('editingUid')?.value;
        const id = document.getElementById('pId')?.value.trim();
        const name = document.getElementById('pName')?.value.trim();
        if(!id || !name) return alert("الرجاء إدخال رقم الملف والاسم");

        const pIdStr = String(id);
        db.patients[pIdStr] = {
            name,
            phone: document.getElementById('pPhone')?.value || '',
            address: document.getElementById('pAddress')?.value || '',
            age: document.getElementById('pAge')?.value || ''
        };
        const price = parseFloat(document.getElementById('pPrice')?.value) || 0;
        const pCase = document.getElementById('pCase')?.value || '';
        const nextDate = document.getElementById('pNext')?.value || '';

        let turn = '';

        if(uidStr) {
            // تعديل زيارة موجودة: نحافظ على رقم الدور الذي كان في ذلك اليوم
            const idx = db.visits.findIndex(v => v.uid == uidStr);
            if(idx !== -1) {
                turn = db.visits[idx].turn || ''; // لا نغير الدور لأنه مرتبط بيوم الزيارة السابق

                db.visits[idx].pId = pIdStr;
                db.visits[idx].price = price;
                db.visits[idx].pCase = pCase;
                db.visits[idx].nextDate = nextDate;
                // لا نغير التاريخ أو الدور
            }
        } else {
            // زيارة جديدة: حساب الدور بناءً على عدد المرضى اليوم
            const todayStr = new Date().toLocaleDateString('en-GB');
            const visitsToday = db.visits.filter(v => v.date === todayStr);
            // إيجاد أكبر رقم دور تم إعطاؤه اليوم
            const maxTurnToday = visitsToday.reduce((max, v) => Math.max(max, Number(v.turn) || 0), 0);
            turn = maxTurnToday + 1;

            db.visits.push({
                uid: Date.now(), 
                pId: pIdStr, 
                price, 
                pCase, 
                nextDate, 
                turn,
                date: todayStr // تاريخ الزيارة هو اليوم
            });
        }
        saveDB();
        resetForm();
        refreshStatsAndLists();
    }

    function editVisit(uid) {
        const v = db.visits.find(x => x.uid == uid);
        if (!v) return;
        const p = db.patients[v.pId];
        if (!p) return;
        document.getElementById('editingUid').value = v.uid;
        document.getElementById('pId').value = v.pId;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPhone').value = p.phone || '';
        document.getElementById('pAddress').value = p.address || '';
        document.getElementById('pAge').value = p.age || '';
        document.getElementById('pPrice').value = v.price;
        document.getElementById('pTurn').value = v.turn || '';
        document.getElementById('pNext').value = toDateInputValue(v.nextDate);
        document.getElementById('pCase').value = v.pCase || '';
        document.getElementById('saveBtn').innerText = 'تحديث الزيارة';
        document.getElementById('cancelBtn').style.display = 'inline-flex';
        document.getElementById('formTitle').innerText = 'تعديل الزيارة';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function resetForm() {
        document.getElementById('editingUid').value = '';
        ['pId','pName','pPhone','pAddress','pAge','pPrice','pTurn','pCase','pNext'].forEach(f => {
            const el = document.getElementById(f);
            if(el) el.value = '';
        });
        document.getElementById('saveBtn').innerText = 'حفظ الزيارة';
        document.getElementById('cancelBtn').style.display = 'none';
        document.getElementById('formTitle').innerText = 'إضافة زيارة جديدة';
    }

    function autoLoadPatient() {
        const id = document.getElementById('pId')?.value;
        const editingUid = document.getElementById('editingUid')?.value;
        if(id && db.patients[id] && !editingUid) {
            document.getElementById('pName').value = db.patients[id].name;
            document.getElementById('pPhone').value = db.patients[id].phone || '';
            document.getElementById('pAddress').value = db.patients[id].address || '';
            document.getElementById('pAge').value = db.patients[id].age || '';
            // حساب الدور اليومي التلقائي للزيارة الجديدة
            const todayStr = new Date().toLocaleDateString('en-GB');
            const visitsToday = db.visits.filter(v => v.date === todayStr);
            const maxTurnToday = visitsToday.reduce((max, v) => Math.max(max, Number(v.turn) || 0), 0);
            document.getElementById('pTurn').value = maxTurnToday + 1;
        } else if(!id) {
            document.getElementById('pTurn').value = '';
        }
    }

    function deleteVisit(uid) {
        if(confirm("حذف هذه الزيارة؟")) {
            db.visits = db.visits.filter(v => v.uid !== uid);
            saveDB();
            refreshStatsAndLists();
        }
    }

    // ======================= المصاريف =======================
    function renderExpensesTab() {
        return `
            <div class="card">
                <h3 style="margin-bottom:16px">إضافة مصروف</h3>
                <div class="form-grid">
                    <div class="form-group"><label>الوصف</label><input type="text" id="expTitle"></div>
                    <div class="form-group"><label>المبلغ</label><input type="number" id="expAmount" value="0"></div>
                    <div class="form-group"><label>التاريخ</label><input type="date" id="expDate"></div>
                </div>
                <button class="btn btn-primary" onclick="saveExpense()" style="margin-top:15px">إضافة</button>
            </div>
            <div id="expenseListContainer"></div>
        `;
    }

    function renderExpensesList() {
        const container = document.getElementById('expenseListContainer');
        if (!container) return;
        container.innerHTML = db.expenses.slice().reverse().map(e => `
            <div class="list-item" style="border-right-color: var(--danger);">
                <div class="item-header">
                    <div class="item-title">${e.title}</div>
                    <button class="btn btn-danger btn-sm" onclick="deleteExpense(${e.uid})">حذف</button>
                </div>
                <div class="info-grid">
                    <div class="info-row"><span class="info-label">المبلغ:</span><span class="info-value">${e.amount.toLocaleString()}</span></div>
                    <div class="info-row"><span class="info-label">التاريخ:</span><span class="info-value">${e.date}</span></div>
                </div>
            </div>`).join('');
    }

    function saveExpense() {
        const title = document.getElementById('expTitle')?.value.trim();
        const amount = parseFloat(document.getElementById('expAmount')?.value) || 0;
        const rawDate = document.getElementById('expDate')?.value;
        const dateStr = rawDate ? new Date(rawDate).toLocaleDateString('en-GB') : new Date().toLocaleDateString('en-GB');
        if(title && amount > 0) {
            db.expenses.push({ uid: Date.now(), title, amount, date: dateStr });
            saveDB();
            document.getElementById('expTitle').value = '';
            document.getElementById('expAmount').value = '';
            renderExpensesList();
        }
    }

    function deleteExpense(uid) {
        if(confirm("حذف المصروف؟")) {
            db.expenses = db.expenses.filter(e => e.uid !== uid);
            saveDB();
            renderExpensesList();
        }
    }

    // ======================= الإعدادات =======================
    function renderSettingsTab() {
        return `
            <div class="settings-grid">
                <div class="card">
                    <h3 style="margin-bottom:16px">هوية العيادة</h3>
                    <div class="form-group"><label>اسم العيادة / الطبيب</label><input type="text" id="clinicNameInput" value="${db.settings.clinicName || ''}"></div>
                    <button class="btn btn-warning" onclick="updateClinicName()">تحديث</button>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:16px">أدوات النسخ الاحتياطي</h3>
                    <button class="btn btn-outline btn-block" onclick="copyBackup()">📋 نسخ احتياطي</button>
                    <button class="btn btn-outline btn-block" onclick="restoreBackup()" style="margin-top:8px">📥 استعادة البيانات</button>
                    <button class="btn btn-outline btn-block" onclick="exportExcel()" style="margin-top:8px">📊 تصدير Excel</button>
                    <hr style="margin:16px 0">
                    <button class="btn btn-danger btn-block" onclick="clearAllData()">⚠️ مسح كل البيانات</button>
                </div>
            </div>
        `;
    }

    function updateClinicName() {
        const newName = document.getElementById('clinicNameInput')?.value;
        if(newName) {
            db.settings.clinicName = newName;
            saveDB();
            applySettings();
            alert("تم تحديث اسم العيادة");
        }
    }

    function copyBackup() {
        navigator.clipboard.writeText(JSON.stringify(db)).then(() => alert("تم نسخ البيانات"));
    }

    function restoreBackup() {
        const data = prompt("الصق كود البيانات هنا:");
        if(data) {
            try {
                db = JSON.parse(data);
                saveDB();
                location.reload();
            } catch(e) { alert("بيانات غير صالحة"); }
        }
    }

    function exportExcel() {
        let txt = "رقم الملف\tالاسم\tالدور\tعدد الزيارات\tالعمر\tالهاتف\tالسكن\tالتاريخ\tتاريخ المراجعة\tالمبلغ\tالتشخيص\n";
        db.visits.forEach(v => {
            const p = db.patients[v.pId];
            if (!p) return;
            const count = db.visits.filter(x => db.patients[x.pId]?.name === p.name).length;
            txt += `${v.pId}\t${p.name}\t${v.turn||''}\t${count}\t${p.age||''}\t${p.phone||''}\t${p.address||''}\t${v.date}\t${formatDisplayDate(v.nextDate)}\t${v.price}\t${v.pCase||''}\n`;
        });
        navigator.clipboard.writeText(txt).then(() => alert("تم النسخ لبرنامج Excel"));
    }

    function clearAllData() {
        if(confirm("هل أنت متأكد من مسح جميع البيانات؟ لا يمكن التراجع.")) {
            if(confirm("تأكيد نهائي: مسح كل البيانات")) {
                db.patients = {};
                db.visits = [];
                db.expenses = [];
                saveDB();
                location.reload();
            }
        }
    }

    // ======================= PWA =======================
    (function setupPWA() {
        const manifest = {
            name: "نظام إدارة العيادة",
            short_name: "عيادة",
            start_url: "./",
            display: "standalone",
            background_color: "#f5f7fa",
            theme_color: "#0f4c81",
            icons: [
                { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>", sizes: "100x100", type: "image/svg+xml" },
                { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f4c81' width='192' height='192' rx='20'/><text x='96' y='96' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='120'>🏥</text></svg>", sizes: "192x192", type: "image/svg+xml" },
                { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect fill='%230f4c81' width='512' height='512' rx='40'/><text x='256' y='256' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='300'>🏥</text></svg>", sizes: "512x512", type: "image/svg+xml" }
            ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        document.getElementById('manifest-link').href = url;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
    })();
</script>
